[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narrativewatch-ai"
version = "1.0.0"
description = "Multi-Agent Social Media Intelligence Platform"
readme = "../README.md"
requires-python = ">=3.10"
authors = [
    {name = "NarrativeWatch Team"}
]
dependencies = [
    "langchain>=0.1.0",
    "langchain-google-vertexai>=0.1.0",
    "langchain-community>=0.1.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "tavily-python>=1.0.0",
    "instagrapi>=2.0.0",
    "requests>=2.31.0",
    "google-cloud-vertexai>=0.14.0",
    "google-auth>=2.28.0",
    "transformers>=4.30.0",
    "nltk>=3.8.0",
    "textblob>=0.17.0",
    "spacy>=3.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
    "ipython>=8.0.0",
    "notebook>=7.0.0",
]

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 120
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
