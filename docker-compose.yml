version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15-latest
    container_name: narrativewatch-db
    environment:
      POSTGRES_USER: narrativewatch
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: narrativewatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narrativewatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: narrativewatch-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://narrativewatch:secure_password@postgres:5432/narrativewatch
      VERTEX_AI_PROJECT_ID: ${VERTEX_AI_PROJECT_ID}
      VERTEX_AI_LOCATION: us-central1
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      PORT: 5000
      DEBUG: False
    ports:
      - "5000:5000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
